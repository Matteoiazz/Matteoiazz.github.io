<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <!-- Monogramma del sito: quadrato scuro arrotondato con le iniziali, leggibile su schede chiare e scure. -->
  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#262626"/>
      <stop offset="1" stop-color="#0d0d0d"/>
    </linearGradient>
    <linearGradient id="lettere" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0.3" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#bdbdbd"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="15" fill="url(#fondo)"/>
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="14.25" fill="none" stroke="#ffffff" stroke-opacity="0.16" stroke-width="1.5"/>
  <text x="32" y="43" text-anchor="middle" font-family="Geist, Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="29" font-weight="600" letter-spacing="-1.2" fill="url(#lettere)">MI</text>
</svg>
